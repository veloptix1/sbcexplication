<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliation - Gagne en invitant tes amis</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --sbc-blue: #0052FF; --sbc-light-blue: #E6F0FF; --wa-green: #25D366; --wa-dark-green: #128C7E; --sbc-gold: #FFC107; --sbc-dark: #1A202C; --sbc-gray: #F8F9FA; --sbc-border: #E2E8F0; --sbc-text: #2D3748; --sbc-muted: #718096; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        body { background-color: #FFFFFF; color: var(--sbc-text); overflow-x: hidden; line-height: 1.6; padding-bottom: 80px; }
        nav.top-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; position: fixed; width: 100%; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--sbc-border); }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--sbc-blue); letter-spacing: 1px; }
        .logo span { color: var(--wa-green); }
        .btn-nav { background: var(--wa-green); color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
        .btn-nav:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6); }
        section { padding: 80px 5% 40px; }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 { font-size: 2rem; font-weight: 700; margin-bottom: 10px; color: var(--sbc-dark); }
        .section-title h2 span { color: var(--sbc-blue); }
        .section-title p { color: var(--sbc-muted); max-width: 600px; margin: 0 auto; font-size: 0.95rem; }
        .hero { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 120px 20px 60px; background: linear-gradient(135deg, var(--sbc-light-blue) 0%, #FFFFFF 100%); }
        .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; line-height: 1.1; margin-bottom: 20px; color: var(--sbc-dark); animation: fadeInUp 1s ease-out; }
        .hero h1 span { color: var(--wa-green); }
        .hero p { font-size: 1.1rem; color: var(--sbc-muted); max-width: 700px; margin-bottom: 30px; animation: fadeInUp 1s ease-out 0.2s both; }
        .cta-container { display: flex; gap: 15px; animation: fadeInUp 1s ease-out 0.4s both; flex-wrap: wrap; justify-content: center; }
        .btn-primary { background: var(--wa-green); color: white; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 1rem; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4); display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 40px rgba(37, 211, 102, 0.6); background: #1EBE5A; }
        .btn-secondary { background: white; color: var(--sbc-blue); padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 1rem; border: 2px solid var(--sbc-blue); transition: all 0.3s ease; }
        .btn-secondary:hover { background: var(--sbc-light-blue); }
        .affiliation-section { background: var(--sbc-dark); color: white; padding: 80px 5%; }
        .affiliation-section .section-title h2 { color: white; }
        .affiliation-section .section-title p { color: #A0AEC0; }
        .tree-container { max-width: 800px; margin: 0 auto; text-align: center; }
        .tree-level { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .tree-node { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 15px 25px; text-align: center; position: relative; transition: all 0.3s ease; }
        .tree-node:hover { background: rgba(37, 211, 102, 0.2); border-color: var(--wa-green); }
        .tree-node .gain { color: var(--sbc-gold); font-weight: 800; font-size: 1.2rem; display: block; }
        .tree-node .label { font-size: 0.8rem; color: #A0AEC0; }
        .tree-arrow { font-size: 2rem; color: var(--wa-green); margin: 10px 0; }
        .steps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1100px; margin: 0 auto; }
        .step-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); text-align: center; border: 1px solid var(--sbc-border); transition: all 0
